name: Release

# Every push to main (that is, every merged pull request) publishes a GitHub Release for the version in package.json,
# if that version has not been released yet. To ship a new version, bump "version" in package.json in your pull request
# (npm version <x.y.z> --no-git-tag-version). Versions below 1.0.0 are marked as pre-releases.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create the release if this version is new
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to do."
            exit 0
          fi
          flags=()
          case "$version" in 0.*) flags+=(--prerelease) ;; *) flags+=(--latest) ;; esac
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes "${flags[@]}"
          echo "Published $tag at $GITHUB_SHA"
